name: Astra CI

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "."
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          docker version

      - name: Build
        run: |
          docker build --file Dockerfile --tag astra-app:ci . && docker save astra-app:ci --output astra-container-image.tar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-build
          path: ".next"
          if-no-files-found: ignore
